<div class="page">

  <div class="page-head">
    <div>
      <div class="eyebrow reveal">Gestão</div>
      <h1 class="page-title reveal" style="--i:1">Configurações</h1>
      <p class="page-sub reveal" style="--i:2">Ajuste a oficina, a equipe e as integrações.</p>
    </div>
    <div class="input-icon reveal" style="--i:3; width: 260px">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="input" placeholder="Buscar configuração" [(ngModel)]="searchQuery">
    </div>
  </div>

  <div class="segmented reveal" style="--i:3; margin-bottom: 18px">
    <button *ngFor="let f of filters" type="button" [class.active]="activeFilter === f.key" (click)="activeFilter = f.key">
      {{ f.label }}
    </button>
  </div>

  <div class="grid">
    <button
      type="button"
      *ngFor="let card of filteredCards; let i = index"
      class="scard reveal"
      [style.--i]="i + 3"
      [class.soon]="!card.available"
      [disabled]="!card.available"
      (click)="open(card)">
      <div class="scard-top">
        <span class="scard-icon"><i [class]="card.icon"></i></span>
        <span class="tag" *ngIf="!card.available">Em breve</span>
        <i class="fa-solid fa-arrow-right scard-go" *ngIf="card.available"></i>
      </div>
      <h3>{{ card.name }}</h3>
      <p>{{ card.description }}</p>
    </button>
  </div>

  <div class="panel" *ngIf="filteredCards.length === 0">
    <div class="empty">
      <div class="empty-mark"><i class="fa-solid fa-magnifying-glass"></i></div>
      <h4>Nada com "{{ searchQuery }}"</h4>
      <p>Tente outro termo.</p>
    </div>
  </div>

</div>
