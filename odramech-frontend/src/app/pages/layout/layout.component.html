@if (mustChangePassword()) {
  <app-first-password-modal></app-first-password-modal>
} @else {
<div class="shell" [class.is-collapsed]="collapsed" [class.is-mobile-open]="mobileOpen">

  <app-left-menu
    class="shell-side"
    [isCollapsed]="collapsed"
    (estadoMenuChange)="toggleCollapse()">
  </app-left-menu>

  <div class="shell-scrim" (click)="closeMobile()"></div>

  <div class="shell-main">
    <app-header (estadoMenuChange)="toggleMobile()"></app-header>
    @if (isStaff()) {
      <app-subscription-banner></app-subscription-banner>
    }

    <main class="shell-content">
      @if (outletAlive) {
        <router-outlet></router-outlet>
      }
    </main>
  </div>

</div>
}
