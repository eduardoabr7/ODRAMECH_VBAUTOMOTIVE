<div class="modal-content">
  <div class="modal-header text-white">
    <h5 class="modal-title">{{ title || 'Cadastro' }}</h5>
    <button
      type="button"
      class="btn-close btn-close-white"
      aria-label="Close"
      (click)="attemptClose()"
    ></button>
  </div>

  <div class="modal-body bg-light container">
    <div class="row">
      <div class="col-12 input-group mb-3">
        <input
          type="search"
          class="form-control"
          placeholder="Pesquisar…"
          aria-label="Search"
          aria-describedby="basic-addon1"
          [(ngModel)]="searchTerm"
          (input)="filterEnterprises()">
      </div>
    </div>

    <div *ngFor="let enterprise of filteredCorps" 
    class="row selection-card mt-1"
    (click)="selectEnterprise(enterprise)">
      <div class="col-4">
        <div class="sel-photo" [style.background]="enterprise.logoUrl ? null : color(enterprise.name)">
          <img *ngIf="enterprise.logoUrl" [src]="enterprise.logoUrl" alt="">
          <span *ngIf="!enterprise.logoUrl">{{ initials(enterprise.name) }}</span>
        </div>
      </div>
      <div class="col-8 p-sm-0">
        <div class="
        info-enterp
        mt-3">
          <span>{{ enterprise.name }}</span>
          <h6 class="m-0" *ngIf="enterprise.displayName && enterprise.displayName !== enterprise.name">{{ enterprise.displayName }}</h6>
          <h6 class="m-0">{{ enterprise.establishments?.length || 0 }} estabelecimento(s)</h6>
        </div>
      </div>
    </div>
  </div>
</div>
