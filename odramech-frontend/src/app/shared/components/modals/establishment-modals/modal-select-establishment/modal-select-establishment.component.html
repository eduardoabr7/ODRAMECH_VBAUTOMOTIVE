<div class="modal-content">
  <div class="modal-header text-white">
    <h5 class="modal-title">{{ title || 'Cadastro' }}</h5>
    <button
      type="button"
      class="btn-close btn-close-white"
      aria-label="Close"
      (click)="attemptClose()"
    ></button>
  </div>

  <div class="modal-body bg-light container">
    <div class="row">
      <div class="col-12 input-group mb-3">
        <input
          type="search"
          class="form-control"
          placeholder="Pesquisar…"
          aria-label="Search"
          aria-describedby="basic-addon1"
          [(ngModel)]="searchTerm"
          (input)="filterEstablishments()">
      </div>
    </div>

    <div *ngFor="let establishment of filteredCorps" 
    class="row selection-card mt-1"
    (click)="selectEstablishment(establishment)">
      <div class="col-4">
        <div class="sel-photo" [style.background]="establishment.logoUrl ? null : color(establishment.name)">
          <img *ngIf="establishment.logoUrl" [src]="establishment.logoUrl" alt="">
          <span *ngIf="!establishment.logoUrl">{{ initials(establishment.name) }}</span>
        </div>
      </div>
      <div class="col-8 p-sm-0">
        <div class="
        info-enterp
        mt-3">
          <span>{{ establishment.name }}</span>
          <h6 class="m-0" *ngIf="establishment.phone">{{ establishment.phone }}</h6>
          <h6 class="m-0" *ngIf="establishment.address">{{ establishment.address.street }}, {{ establishment.address.number }} · {{ establishment.address.city }}</h6>
        </div>
      </div>
    </div>
  </div>
</div>
