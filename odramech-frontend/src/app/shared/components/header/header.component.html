<header class="topbar">

  <div class="tb-left">
    <button class="tb-burger" type="button" (click)="toggleCollapse()" aria-label="Abrir menu">
      <i class="fa-solid fa-bars-staggered"></i>
    </button>
    <div class="crumbs">
      <span class="crumb-root">{{ ctx?.usercorp?.establishment?.name }}</span>
      <i class="fa-solid fa-chevron-right crumb-sep"></i>
      <span class="crumb-cur">{{ section }}</span>
    </div>
  </div>

  <div class="tb-right">
    <form class="tb-search input-icon" (ngSubmit)="submitSearch()" *ngIf="session.isStaff$ | async">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        #searchInput
        class="input"
        name="q"
        [(ngModel)]="search"
        placeholder="Buscar OS, placa ou cliente"
        autocomplete="off">
      <kbd>/</kbd>
    </form>

    <a routerLink="/orders/new" class="btn-x btn-accent sm tb-new" *ngIf="session.isStaff$ | async">
      <i class="fa-solid fa-plus"></i><span>Nova OS</span>
    </a>

    <div class="tb-user" closeOnClickOutside (clickOutside)="menuOpen = false">
      <button type="button" class="tb-user-btn" (click)="menuOpen = !menuOpen" [class.open]="menuOpen">
        <span class="avatar sm">{{ ctx?.user?.name | initials }}</span>
        <i class="fa-solid fa-chevron-down caret"></i>
      </button>

      <div class="menu-pop user-pop" *ngIf="menuOpen">
        <div class="pop-head">
          <span class="avatar">{{ ctx?.user?.name | initials }}</span>
          <div class="pop-who">
            <strong>{{ ctx?.user?.name }}</strong>
            <span>{{ ctx?.user?.email }}</span>
          </div>
        </div>
        <div class="pop-meta">
          <span class="tag">{{ ctx?.usercorp?.establishment?.role | roleLabel }}</span>
          <span class="muted">{{ ctx?.usercorp?.name }}</span>
        </div>
        <div class="pop-sep"></div>
        <a class="menu-item" [routerLink]="['/clients', ctx?.user?.id]" *ngIf="session.isStaff$ | async">
          <i class="fa-regular fa-user"></i> Meu cadastro
        </a>
        <a class="menu-item" routerLink="/settings" *ngIf="session.isStaff$ | async">
          <i class="fa-solid fa-sliders"></i> Configurações
        </a>
        <button class="menu-item danger" type="button" (click)="logout()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
        </button>
      </div>
    </div>
  </div>

</header>
